<div class="admin-container">
  <div class="admin-header">
    <h2>Update Notification</h2>
  </div>

  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" [(ngModel)]="notification.title" placeholder="e.g., Scheduled Maintenance">
  </div>

  <div class="form-group">
    <label for="content">Announcement Message</label>
    <textarea id="content" [(ngModel)]="notification.content" placeholder="Describe the situation..."></textarea>
  </div>

  <label class="checkbox-group">
    <input type="checkbox" [(ngModel)]="notification.active">
    <span>Set as Active (Visible on public page)</span>
  </label>

  <button class="save-button" (click)="save()">
    Publish Notification
  </button>

  <a routerLink="/" class="back-link">Return to Public View</a>
</div>
